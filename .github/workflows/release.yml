name: Build & Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\pip\Cache
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install Tesseract OCR
        run: choco install tesseract --no-progress -y

      - name: Install Python dependencies
        run: pip install -r requirements.txt pyinstaller

      - name: Build with PyInstaller
        run: pyinstaller proftracker.spec

      - name: Bundle user guide
        run: Copy-Item README.md "dist\ProfTracker\README.md"

      - name: Zip release
        run: Compress-Archive -Path dist\ProfTracker -DestinationPath ProfTracker-windows.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ProfTracker-windows.zip
            How to Use ProfTracker.docx
          generate_release_notes: true
