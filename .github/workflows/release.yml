name: Build & Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install Tesseract OCR
        run: choco install tesseract --no-progress -y

      - name: Install Python dependencies
        run: uv sync --extra dev

      - name: Run unit tests
        run: uv run pytest tests/unit/ -v

      - name: Build with PyInstaller
        run: uv run pyinstaller proftracker.spec

      - name: Bundle runtime data
        run: |
          Copy-Item README.md "dist\ProfTracker\README.md"

      - name: Zip release
        run: Compress-Archive -Path dist\ProfTracker -DestinationPath ProfTracker-windows.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ProfTracker-windows.zip
            How to Use ProfTracker.docx
          generate_release_notes: true
